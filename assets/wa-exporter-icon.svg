<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">WA Exporter</title>
<desc id="desc">Green WA Exporter logo with a white chat bubble, WA letters, and a lime download arrow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12b85f"/>
    <stop offset="0.52" stop-color="#07984f"/>
    <stop offset="1" stop-color="#067a43"/>
  </linearGradient>
  <linearGradient id="download" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#93ff59"/>
    <stop offset="1" stop-color="#55e62f"/>
  </linearGradient>
</defs>

<rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bg)"/>

<!-- chat bubble ring -->
<path
  d="M255 82
     C157 82 82 154 82 245
     C82 290 102 331 136 361
     L111 431
     L183 393
     C205 401 229 405 255 405
     C353 405 430 333 430 245
     C430 154 353 82 255 82Z"
  fill="none"
  stroke="#ffffff"
  stroke-width="28"
  stroke-linecap="round"
  stroke-linejoin="round"/>

<!-- WA wordmark -->
<text x="255" y="260"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="116"
      font-weight="900"
      letter-spacing="-7"
      fill="#ffffff">WA</text>

<!-- download arrow -->
<path d="M255 278 V346" stroke="url(#download)" stroke-width="28" stroke-linecap="round"/>
<path d="M213 326 L255 368 L297 326" fill="none" stroke="url(#download)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M195 392 V413 H315 V392" fill="none" stroke="url(#download)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>